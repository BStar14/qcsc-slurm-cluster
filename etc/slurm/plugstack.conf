# QRMI SPANK plugin. "optional": jobs still run if the plugin fails to load.
# A job that requests --qpu fails until /etc/slurm/qrmi_config.json lists that QPU
# (install it with `sudo install -m 600 ~/.qiskit/qrmi_config.json /etc/slurm/qrmi_config.json`).
optional /usr/lib64/slurm/spank_qrmi.so /etc/slurm/qrmi_config.json
