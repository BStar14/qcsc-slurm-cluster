# slurmdbd.conf of qcsc-slurm-cluster. The database runs on the private compose
# network only; change StoragePass together with MARIADB_PASSWORD in compose.yml.
AuthType=auth/munge
DbdAddr=slurmdbd
DbdHost=slurmdbd
SlurmUser=slurm
DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurmdbd/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=mysql
StorageUser=slurm
StoragePass=password
StorageLoc=slurm_acct_db
