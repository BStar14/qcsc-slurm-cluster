# slurm.conf of qcsc-slurm-cluster. Two compute nodes c1 and c2 in partition normal,
# PMIx as the default MPI plugin, and a count-only qpu GRES for the QRMI SPANK plugin.
# The entrypoint replaces @NODE_CPUS@ and @NODE_MEMORY_MB@ from QCSC_NODE_CPUS and
# QCSC_NODE_MEMORY_MB on first start. Edit /etc/slurm/slurm.conf in a running cluster,
# then run `scontrol reconfigure` or restart the cluster.
ClusterName=qcsc
SlurmctldHost=slurmctld
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/lib/slurmd
SlurmdSpoolDir=/var/spool/slurmd
SwitchType=switch/none
MpiDefault=pmix
SlurmctldPidFile=/var/run/slurmd/slurmctld.pid
SlurmdPidFile=/var/run/slurmd/slurmd.pid
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log
JobCompType=jobcomp/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageTRES=gres/qpu

GresTypes=qpu

NodeName=c[1-2] CPUs=@NODE_CPUS@ RealMemory=@NODE_MEMORY_MB@ Gres=qpu:1 State=UNKNOWN
PartitionName=normal Default=YES Nodes=c[1-2] MaxNodes=2 MaxTime=1-00:00:00 DefaultTime=01:00:00 State=UP
